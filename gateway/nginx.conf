# ---------------------------------------------------------------------------
# nginx = the single public entry point into the whole system.
# The assignment requires that ALL traffic enters through one public door
# (nginx on port 80) and that internal services are NOT reachable directly
# from outside. We achieve that by:
#   1. Only publishing nginx's port 80 to the host (see docker-compose.yml).
#   2. Forwarding requests to internal services over the private docker network.
# ---------------------------------------------------------------------------

events {}

http {
    # "upstream" just gives a friendly name to an internal service.
    # "api-service" is the service name from docker-compose.yml; docker's
    # internal DNS resolves it to that container's IP.
    upstream api {
        server api-service:3000;
    }

    upstream products {
        server product-service:3000;
    }

    upstream orders {
        server order-service:3000;
    }

    upstream kitchen {
        server kitchen-service:3000;
    }

    server {
        listen 80;

        # Requests to /api/products... go to the product-service.
        # This is listed BEFORE the general /api/ block so it matches first.
        # The trailing slash on proxy_pass strips "/api/products" before
        # forwarding, so /api/products  ->  product-service /products
        #            and /api/products/3 -> product-service /products/3
        location /api/products {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Requests to /api/orders... go to the order-service.
        location /api/orders {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Requests to /api/kitchen... go to the kitchen-service (staff API).
        # /api/kitchen/orders            -> kitchen /orders
        # /api/kitchen/orders/ord-1/ready -> kitchen /orders/ord-1/ready
        location /api/kitchen {
            rewrite ^/api/kitchen(/.*)$ $1 break;
            proxy_pass http://kitchen;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Everything else under /api/ is forwarded to the api-service.
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # A simple gateway health check so we can confirm nginx itself is up.
        location /health {
            return 200 "gateway ok\n";
            add_header Content-Type text/plain;
        }
    }
}
