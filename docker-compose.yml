# ---------------------------------------------------------------------------
# docker-compose.yml
# Starts the ENTIRE system with one command:  docker compose up --build
#
# Services on the private "snabbmat-net" network can talk to each other by
# name (e.g. "rabbitmq", "postgres"). Only nginx publishes a port to your
# host machine, so it is the single public entry point.
# ---------------------------------------------------------------------------

services:
  # --- Message broker: services communicate via events through RabbitMQ ----
  rabbitmq:
    image: rabbitmq:3-management   # "-management" adds a web UI on port 15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      # Exposed only for YOUR convenience during development (the management
      # UI at http://localhost:15672). Not required by the app.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snabbmat-net

  # --- Database ------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NOTE: we do NOT publish 5432 to the host. This keeps the database
    # internal (a grading requirement) AND avoids clashing with the other
    # postgres container you already have running on port 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount our DDL + seed script. Postgres automatically runs any .sql in
      # this folder the FIRST time it starts with an empty data volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snabbmat-net

  # --- Public-facing HTTP API ----------------------------------------------
  api-service:
    build: ./services/api-service
    environment:
      PORT: 3000
    networks:
      - snabbmat-net
    # No "ports:" here on purpose. The api-service is reached only THROUGH
    # nginx, never directly from your host.

  # --- Product catalog / menu ----------------------------------------------
  product-service:
    build: ./services/product-service
    environment:
      PORT: 3000
      # Connection string product-service uses to read the menu from Postgres.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy   # wait until the DB (and its seed) is ready
    networks:
      - snabbmat-net
    # Internal only, just like api-service. Reached via nginx at /api/products.

  # --- Orders: accepts orders via HTTP, publishes order events -------------
  order-service:
    build: ./services/order-service
    environment:
      PORT: 3000
      # Address order-service uses to reach RabbitMQ (internal only).
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      # Persistent storage of orders.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      rabbitmq:
        condition: service_healthy   # wait until RabbitMQ is ready before starting
      postgres:
        condition: service_healthy   # wait until the DB (and its tables) is ready
    networks:
      - snabbmat-net
    # Reached via nginx at /api/orders.

  # --- Kitchen: staff endpoints + listens for order events -----------------
  kitchen-service:
    build: ./services/kitchen-service
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      # Kitchen reads/updates order status in the shared database.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - snabbmat-net
    # Reached via nginx at /api/kitchen (staff endpoints).

  # --- Notifications: listens for order events, notifies the customer ------
  notification-service:
    build: ./services/notification-service
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - snabbmat-net
    # No nginx routing: reached only via RabbitMQ events.

  # --- nginx: the single public door ---------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      # The single public entry point. host 80 -> container 80.
      # (If port 80 is busy on your machine, e.g. Apache/XAMPP, stop it first
      #  or change this to "8080:80".)
      - "80:80"   # the ONLY port exposed to the outside world
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    # Wait for the services nginx routes to, so their names resolve at startup.
    depends_on:
      - api-service
      - product-service
      - order-service
    # If nginx still starts before a service is resolvable, restart it instead
    # of crashing for good.
    restart: unless-stopped
    networks:
      - snabbmat-net

# Named volume so PostgreSQL data survives restarts.
volumes:
  pgdata:

# Private network shared by all services.
networks:
  snabbmat-net:
