# ---------------------------------------------------------------------------
# docker-compose.yml
# Starts the ENTIRE system with one command:  docker compose up --build
#
# Services on the private "snabbmat-net" network can talk to each other by
# name (e.g. "rabbitmq", "postgres"). Only nginx publishes a port to your
# host machine, so it is the single public entry point.
# ---------------------------------------------------------------------------

services:
  # --- Message broker: services communicate via events through RabbitMQ ----
  rabbitmq:
    image: rabbitmq:3-management   # "-management" adds a web UI on port 15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      # Exposed only for YOUR convenience during development (the management
      # UI at http://localhost:15672). Not required by the app.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snabbmat-net

  # --- Database ------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NOTE: we do NOT publish 5432 to the host. This keeps the database
    # internal (a grading requirement) AND avoids clashing with the other
    # postgres container you already have running on port 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snabbmat-net

  # --- Public-facing HTTP API ----------------------------------------------
  api-service:
    build: ./services/api-service
    environment:
      PORT: 3000
    networks:
      - snabbmat-net
    # No "ports:" here on purpose. The api-service is reached only THROUGH
    # nginx, never directly from your host.

  # --- nginx: the single public door ---------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      # host 8080 -> container 80. We use 8080 on the host because Apache
      # (XAMPP) already occupies port 80 on this machine. nginx itself still
      # listens on port 80 INSIDE the container, satisfying the requirement.
      - "8080:80"   # the ONLY port exposed to the outside world
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-service
    networks:
      - snabbmat-net

# Named volume so PostgreSQL data survives restarts.
volumes:
  pgdata:

# Private network shared by all services.
networks:
  snabbmat-net:
